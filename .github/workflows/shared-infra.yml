# Plans on PR, applies on merge to main — the only place `apply` runs is the
# apply job below, gated to pushes on main. workflow_dispatch is there as a
# manual escape hatch (e.g. re-running apply without a new push).
#
# PREREQUISITES before this can actually run:
#   1. A GCS bucket for Terraform state (99_shared-infra currently uses a
#      local backend — vars.TF_STATE_BUCKET below assumes it's been migrated
#      to backend "gcs" {} in main.tf and `terraform init -migrate-state` has
#      been run once, locally, to copy existing state up).
#   2. Repo variable  TF_STATE_BUCKET       — the GCS bucket name.
#   3. Repo secret    CLOUDFLARE_API_TOKEN  — read by the cloudflare provider.
#   4. Repo secret    GCP_SA_KEY            — service-account JSON key with
#      permissions on Cloud Run + Secret Manager + the state bucket. (Swap for
#      Workload Identity Federation instead of a long-lived key if preferred —
#      replace the google-github-actions/auth step's `credentials_json` with
#      `workload_identity_provider` / `service_account`.)

name: shared-infra

on:
  pull_request:
    branches: [main]
    paths:
      - "99_shared-infra/**"
  push:
    branches: [main]
    paths:
      - "99_shared-infra/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  WORKING_DIR: 99_shared-infra

jobs:
  plan:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=shared-infra"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -no-color -input=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan — 99_shared-infra
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=shared-infra"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: terraform apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve -input=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
